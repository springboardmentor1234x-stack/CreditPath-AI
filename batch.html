<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Batch — CreditPathAI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-white">
  <div class="container mx-auto p-6">
    <a href="/static/dashboard.html" class="text-sm text-blue-600">&larr; Back</a>
    <h1 class="text-2xl font-bold mt-4">Batch Prediction</h1>

    <div class="mt-4 bg-white p-6 rounded-xl shadow">
      <p class="text-sm text-gray-600">Paste JSON array of borrowers or upload a file</p>
      <textarea id="jsonArea" class="w-full h-40 p-3 border rounded mt-2"></textarea>
      <input type="file" id="fileInput" class="mt-2" />
      <div class="mt-4">
        <button id="runBtn" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-500 text-white rounded">Run Batch</button>
        <a id="downloadCsv" class="ml-4 text-sm text-blue-600 hidden">Download CSV</a>
      </div>

      <div id="tableWrap" class="mt-6"></div>
    </div>
  </div>

<script>
const token = localStorage.getItem('token');
if(!token) window.location.href='/static/login.html';
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const text = await f.text();
  document.getElementById('jsonArea').value = text;
});

document.getElementById('runBtn').addEventListener('click', async ()=>{
  let txt = document.getElementById('jsonArea').value;
  if(!txt) return alert('Paste JSON first');
  let data;
  try{ data = JSON.parse(txt); }
  catch(e){ return alert('Invalid JSON'); }
  // ensure shape
  const res = await fetch('/batch_predict', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+token}, body: JSON.stringify({borrowers: data})});
  const j = await res.json();
  if(!res.ok){ alert(JSON.stringify(j)); return; }
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '';
  const table = document.createElement('table');
  table.className='w-full text-sm';
  table.innerHTML = `<thead><tr class="text-left"><th>Index</th><th>Probability</th><th>Risk</th><th>Recommendation</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  j.results.forEach((r, idx)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${idx+1}</td><td>${(r.probability*100).toFixed(1)}%</td><td>${r.risk_level}</td><td>${r.recommendation}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  // CSV
  let csv = 'index,probability,risk,recommendation\\n';
  j.results.forEach((r, idx)=> csv += `${idx+1},${r.probability},${r.risk_level},"${r.recommendation}"\\n`);
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.getElementById('downloadCsv');
  a.href = url; a.download = 'batch_results.csv'; a.classList.remove('hidden');
});
</script>
</body>
</html>
