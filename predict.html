<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Predict — CreditPathAI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-white">
  <div class="container mx-auto p-6">
    <a href="/static/dashboard.html" class="text-sm text-blue-600">&larr; Back</a>
    <h1 class="text-2xl font-bold mt-4">Make a Prediction</h1>
    <div class="mt-4 bg-white p-6 rounded-xl shadow">
      <form id="predictForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input name="income" placeholder="Income" required class="p-3 border rounded" />
        <input name="loan_amount" placeholder="Loan Amount" required class="p-3 border rounded" />
        <input name="interest_rate" placeholder="Interest Rate" required class="p-3 border rounded" />
        <input name="credit_score" placeholder="Credit Score" required class="p-3 border rounded" />
        <input name="employment_type" placeholder="Employment Type (salaried/self)" required class="p-3 border rounded" />
        <input name="employment_years" placeholder="Employment Years" required class="p-3 border rounded" />
        <input name="age" placeholder="Age" required class="p-3 border rounded" />
        <input name="existing_loans" placeholder="Existing Loans" required class="p-3 border rounded" />
        <div class="col-span-full">
          <button class="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-500 text-white rounded">Predict</button>
        </div>
      </form>

      <div id="result" class="mt-6 hidden">
        <div id="card" class="p-4 rounded-lg shadow"></div>
        <canvas id="chart" class="mt-4 max-w-xs"></canvas>
      </div>
    </div>
  </div>

<script>
const token = localStorage.getItem('token');
if(!token) window.location.href='/static/login.html';
document.getElementById('predictForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target).entries());
  const body = {
    income: parseFloat(f.income),
    loan_amount: parseFloat(f.loan_amount),
    interest_rate: parseFloat(f.interest_rate),
    credit_score: parseFloat(f.credit_score),
    employment_type: f.employment_type,
    employment_years: parseFloat(f.employment_years),
    age: parseInt(f.age),
    existing_loans: parseInt(f.existing_loans)
  };
  const res = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+token}, body: JSON.stringify(body)});
  const j = await res.json();
  if(!res.ok){ alert(JSON.stringify(j)); return; }
  document.getElementById('result').classList.remove('hidden');
  const card = document.getElementById('card');
  const prob = (j.probability*100).toFixed(1);
  let color = 'bg-green-100 text-green-700';
  if(j.risk_level==='Medium'){ color='bg-orange-100 text-orange-700' }
  if(j.risk_level==='High'){ color='bg-red-100 text-red-700' }
  card.innerHTML = `<div class="${color} p-4 rounded"><div class="text-sm">Default Probability</div><div class="text-2xl font-bold">${prob}%</div><div class="mt-2 font-semibold">${j.risk_level}</div><div class="mt-1">${j.recommendation}</div></div>`;
  const ctx = document.getElementById('chart').getContext('2d');
  if(window.myChart) window.myChart.destroy();
  window.myChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Default','Not Default'],
      datasets: [{ data: [j.probability, 1-j.probability] }]
    }
  });
});
</script>
</body>
</html>
