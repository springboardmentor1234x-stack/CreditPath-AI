<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Your Go-To Bank</title>
</head>
<body>

    <header>
        <h1>WELCOME TO DEFAULT RISK PREDICTOR!</h1>
        <h1>For banks worried about loan defaults.</h1>
    </header>

    <nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">DRP</a>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
                <a href="app.html" class="nav-link">Loan Application</a>
            </li>
            <li class="nav-item">
                <a href="about.html" class="nav-link">About the Project</a>
            </li>
        </ul>
        <div class="nav-auth">
            <a href="login.html" class="nav-link btn-login">Log In</a>
            <a href="signup.html" class="nav-link btn-signup">Sign Up</a>
        </div>
    </div>

</nav>

    <div class="container">
        <h2>Check borrower eligibility by entering their details below</h2>
        
        <div class="controls-container">
          <label for="repeatCount">Number of Applications:</label>
          <input type="number" id="repeatCount" placeholder="e.g., 3" min="1">
          <button type="button" id="generateButton" class="btn">Generate Forms</button>
        </div>

        <hr>

        <form id="batchForm">
            <div id="form-container"></div>
            
            <button type="submit" id="submitAllButton" class="btn btn-primary" style="display:none;">
              Submit All Applications
            </button>
        </form>
        
        <div id="results-container"></div>

    </div> <template id="form-template">
      <div class="loan-form-entry"> 
        <h3>LOAN APPLICATION FORM</h3>
        
        <div class="form-grid">
          <div>
            <label for="loan_amnt">Loan Amount:</label>
            <input type="number" name="loan_amnt" placeholder="e.g., 20000" required>
          </div>
          <div>
            <label for="term">Loan Term:</label>
            <select name="term" required>
                <option value="36 months">36 Months</option>
                <option value="60 months">60 Months</option>
            </select>
          </div>
          <div>
            <label for="int_rate">Interest Rate (%):</label>
            <input type="number" step="0.1" name="int_rate" placeholder="e.g., 14.5" required>
          </div>
          <div>
            <label for="installment">Est. Monthly Installment:</label>
            <input type="number" step="0.01" name="installment" placeholder="e.g., 688.0" required>
          </div>
          <div>
            <label for="emp_length">Employment Length:</label>
            <select name="emp_length" required>
                <option value="10+ years">10+ years</option>
                <option value="9 years">9 years</option>
                <option value="8 years">8 years</option>
                <option value="7 years">7 years</option>
                <option value="6 years">6 years</option>
                <option value="5 years">5 years</option>
                <option value="4 years">4 years</option>
                <option value="3 years">3 years</option>
                <option value="2 years">2 years</option>
                <option value="1 year">1 year</option>
                <option value="< 1 year">< 1 year</option>
            </select>
          </div>
          <div>
            <label for="home_ownership">Home Ownership:</label>
            <select name="home_ownership" required>
                <option value="MORTGAGE">Mortgage</option>
                <option value="RENT">Rent</option>
                <option value="OWN">Own</option>
                <option value="OTHER">Other</option>
            </select>
          </div>
          <div>
            <label for="annual_inc">Annual Income:</label>
            <input type="number" name="annual_inc" placeholder="e.g., 75000" required>
          </div>
          <div>
            <label for="verification_status">Verification Status:</label>
            <select name="verification_status" required>
                <option value="Verified">Verified</option>
                <option value="Source Verified">Source Verified</option>
                <option value="Not Verified">Not Verified</option>
            </select>
          </div>
          <div>
            <label for="purpose">Loan Purpose:</label>
            <select name="purpose" required>
                <option value="debt_consolidation">Debt Consolidation</option>
                <option value="credit_card">Credit Card</option>
                <option value="home_improvement">Home Improvement</option>
                <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label for="dti">DTI (Debt-to-Income %):</label>
            <input type="number" step="0.1" name="dti" placeholder="e.g., 19.8" required>
          </div>
          <div>
            <label for="delinq_2yrs">Delinquencies (Last 2 Yrs):</label>
            <input type="number" name="delinq_2yrs" value="0">
          </div>
          <div>
            <label for="earliest_cr_line">Earliest Credit Line (e.g., Apr-03):</label>
            <input type="text" name="earliest_cr_line" placeholder="e.g., Apr-03" required>
          </div>
          <div>
            <label for="inq_last_6mths">Inquiries (Last 6 Mths):</label>
            <input type="number" name="inq_last_6mths" value="0">
          </div>
          <div>
            <label for="open_acc">Open Accounts:</label>
            <input type="number" name="open_acc" placeholder="e.g., 10">
          </div>
          <div>
            <label for="pub_rec">Public Records:</label>
            <input type="number" name="pub_rec" value="0">
          </div>
          <div>
            <label for="revol_bal">Revolving Balance (Rs.):</label>
            <input type="number" name="revol_bal" placeholder="e.g., 15000">
          </div>
          <div>
            <label for="revol_util">Revolving Utilization (%):</label>
            <input type="text" name="revol_util" placeholder="e.g., 72.5%">
          </div>
          <div>
            <label for="total_acc">Total Accounts:</label>
            <input type="number" name="total_acc" placeholder="e.g., 28">
          </div>
        </div>
      </div>
    </template>

    <footer>
        <p>&copy; 2025 Default risk predictor. All rights reserved.</p>
        <p>Contact: default risk predictor</p>
    </footer>
    <script src="auth.js"></script>
    <script src="back.js"></script>
</body>
</html>
