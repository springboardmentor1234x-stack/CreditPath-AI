<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Your default predictor - Sign Up</title>
</head>
<body>

    <header>
        <h1>WELCOME TO DEFAULT RISK PREDICTOR!</h1>
    </header>

    <nav class="navbar">
        <div class="nav-container">
            <div style="display: flex; align-items: center;">
                <a href="index.html" class="nav-logo">DRP</a>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="app.html" class="nav-link">Loan Application</a>
                    </li>
                    <li class="nav-item">
                        <a href="about.html" class="nav-link">About the Project</a>
                    </li>
                </ul>
            </div>
            
            <div class="nav-auth">
                <a href="login.html" class="nav-link btn-login">Log In</a>
                <a href="signup.html" class="nav-link btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <form id="signupForm">
            <h2>Create Your Account</h2>
            
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full-width">Create Account</button>
            
            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Log In</a></p>
            </div>
        </form>
    </div>
    <footer>
         <p>&copy; 2025 DEFAULT RISK PREDICTOR. All rights reserved.</p>
        <p>Contact: pratichee-acharya</p>
    </footer>
    <script src="signup.js"></script>
</body>
</html>
